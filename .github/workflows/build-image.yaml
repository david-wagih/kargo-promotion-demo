# "CI ships a new build": builds demo-app and pushes it to GHCR.
# Kargo's Warehouse discovers the new semver tag on its own and creates Freight.
#   gh workflow run build-image.yaml -f version=1.1.0     (or: make release V=1.1.0)
#   git tag v1.1.0 && git push origin v1.1.0
name: build-image

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semver for the new image, e.g. 1.1.0
        required: true
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version
        id: v
        run: |
          V="${{ inputs.version || github.ref_name }}"
          V="${V#v}"
          [[ $V =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::'$V' is not semver"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/demo-app" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # multi-arch so it runs on kind on Apple silicon too
      - uses: docker/build-push-action@v7
        with:
          context: app
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.v.outputs.version }}
          tags: ${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}

      - run: echo "### Pushed \`${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
