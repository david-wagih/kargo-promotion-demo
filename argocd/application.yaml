# The ONLY thing this cluster's Argo CD watches: its own env branch.
# It has no idea Kargo exists — it just syncs whatever lands on env/__ENV__.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: __REPO_URL__
    targetRevision: env/__ENV__
    path: manifests
    directory:
      exclude: .gitkeep
  destination:
    server: https://kubernetes.default.svc
    namespace: demo-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
