# Used by argocd-diff-preview only (.github/workflows/argocd-diff-preview.yaml):
# renders overlays/dev exactly like the dev cluster's Argo CD would, so every PR
# shows its real impact on dev before merge.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-app-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/david-wagih/kargo-promotion-demo.git
    targetRevision: main
    path: platform-config/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: demo-app
