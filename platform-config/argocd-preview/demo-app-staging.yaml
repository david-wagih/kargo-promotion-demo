# Used by argocd-diff-preview only (.github/workflows/argocd-diff-preview.yaml):
# renders overlays/staging exactly like the staging cluster's Argo CD would, so every PR
# shows its real impact on staging before merge.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-app-staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/david-wagih/kargo-promotion-demo.git
    targetRevision: main
    path: platform-config/overlays/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: demo-app
