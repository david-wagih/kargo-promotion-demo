apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
labels:
  - pairs:
      env: prod
replicas:
  - name: demo-app
    count: 3
configMapGenerator:
  - name: demo-app-config
    behavior: merge
    literals:
      - ENV_NAME=prod
      - BANNER_COLOR=#1565c0
      - GREETING=deployed to the prod cluster
patches:
  - path: resources-patch.yaml
