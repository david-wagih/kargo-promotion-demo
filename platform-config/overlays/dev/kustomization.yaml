apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
labels:
  - pairs:
      env: dev
replicas:
  - name: demo-app
    count: 1
configMapGenerator:
  - name: demo-app-config
    behavior: merge
    literals:
      - ENV_NAME=dev
      - BANNER_COLOR=#2e7d32
      - GREETING=dev — now with extra sparkle ✨
