# demo-app: build and push a multi-arch image to this project's GitLab registry
# (stand-in for Artifactory). Kargo's Warehouse discovers the new semver tag by itself.
#
# Real setup: the app pipeline triggers config-tde-<project> with APP + VERSION and
# the promotion component writes app.version into <env>-values.yaml.
# With Kargo the app pipeline only has to publish the image.
#
#   make release            -> API-triggered pipeline with VERSION=x.y.z
#   git tag v1.3.0 && git push origin v1.3.0

workflow:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    - if: $CI_PIPELINE_SOURCE =~ /^(api|web)$/ && $VERSION

build-image:
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: tcp://docker:2375
  script:
    - V="${VERSION:-${CI_COMMIT_TAG#v}}"
    - echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "'$V' is not semver"; exit 1; }
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    # multi-arch so it runs on kind on Apple silicon too
    - docker run --privileged --rm tonistiigi/binfmt --install arm64,amd64
    - docker buildx create --use --name multi
    - docker buildx build --platform linux/amd64,linux/arm64 --build-arg VERSION="$V"
        --label org.opencontainers.image.source="$CI_PROJECT_URL"
        --label org.opencontainers.image.version="$V"
        -t "$CI_REGISTRY_IMAGE:$V" --push .
    - echo "pushed $CI_REGISTRY_IMAGE:$V"
